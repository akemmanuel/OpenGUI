packages:
  - "packages/*"

overrides:
  "@vitest/browser": 4.1.9
  "@vitest/browser-preview": 4.1.9
  vitest: 4.1.9

patchedDependencies:
  "@earendil-works/pi-ai@0.82.1": "patches/@earendil-works__pi-ai@0.82.1.patch"

peerDependencyRules:
