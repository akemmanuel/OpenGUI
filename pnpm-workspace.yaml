packages:
  - "packages/*"

overrides:
  "@vitest/browser": 5.0.4
  "@vitest/browser-preview": 5.0.4
  vitest: 5.0.4

peerDependencyRules:
  allowedVersions:
    # Vite Plus provides a Vite-compatible API under its own package version.
    vite: 1.1.0
    # better-auth's optional peer is only used for its own tests.
    vitest: 5.0.4

allowBuilds:
  "@google/genai": true
  agent-browser: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
