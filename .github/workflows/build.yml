name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to validate and build (without a leading v)
        required: true
        default: 0.6.0-rc.1
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify requested version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          requested_version=${REQUESTED_VERSION#v}
          if ! [[ "$requested_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version is not strict SemVer: $requested_version" >&2
            exit 1
          fi
          test "$package_version" = "$requested_version" || {
            echo "Requested version $requested_version does not match package.json $package_version" >&2
            exit 1
          }
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run slop-check
      - run: pnpm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: |
            dist
            dist-electron
          retention-days: 1
          if-no-files-found: error

  build-desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux
            command: pnpm exec electron-builder --linux deb AppImage --publish never
            artifacts: |
              release/*.deb
              release/*.AppImage
              release/latest-linux.yml
          - runner: windows-latest
            name: windows
            command: pnpm exec electron-builder --win nsis --publish never
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - runner: macos-latest
            name: mac-x64
            command: pnpm exec electron-builder --mac dmg zip --x64 --publish never
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac*.yml
          - runner: macos-latest
            name: mac-arm64
            command: pnpm exec electron-builder --mac dmg zip --arm64 --publish never
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac*.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
      - name: Package ${{ matrix.name }} without publishing
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          retention-days: 30
          if-no-files-found: error

  build-android:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
      - run: pnpm exec cap sync android
      - run: cd android && ./gradlew assembleRelease
        env:
          OPENGUI_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      - name: Collect APK
        shell: bash
        run: |
          version='${{ github.event_name == 'push' && github.ref_name || inputs.version }}'
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/*.apk "release-android/OpenGUI-${version#v}-android-release.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: release-android/*.apk
          retention-days: 30
          if-no-files-found: error

  build-docker:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: opengui-candidate:${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke image health
        shell: bash
        run: |
          cid=$(docker run -d --platform '${{ matrix.platform }}' -p 127.0.0.1::3000 \
            -e OPENGUI_ALLOWED_ROOTS=/workspace "opengui-candidate:${{ matrix.suffix }}")
          trap 'docker logs "$cid"; docker rm -f "$cid"' EXIT
          port=$(docker port "$cid" 3000/tcp | awk -F: '{print $NF}')
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:$port/api/health" >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Container did not become healthy" >&2
          exit 1

  prepare-candidate:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android
          path: artifacts/android
      - name: Merge macOS updater metadata
        run: |
          node scripts/merge-latest-mac.mjs \
            --x64-dir artifacts/desktop-mac-x64 \
            --arm64-dir artifacts/desktop-mac-arm64 \
            --out-dir artifacts/desktop-mac-x64
      - name: Verify updater metadata and generate checksums
        shell: bash
        run: |
          test -f artifacts/desktop-linux/latest-linux.yml
          test -f artifacts/desktop-windows/latest.yml
          test -f artifacts/desktop-mac-x64/latest-mac.yml
          find artifacts -type f ! -name 'latest-mac-*.yml' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            artifacts
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

  publish-docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop, build-android, build-docker, prepare-candidate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/akemmanuel/opengui
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=OpenGUI
            org.opencontainers.image.description=OpenGUI first-party agent Host and web interface
            org.opencontainers.image.source=https://github.com/akemmanuel/OpenGUI
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-docker, prepare-candidate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate
      - name: Create prerelease and upload validated artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate ambiguous state" >&2
            exit 1
          fi
          args=("$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes)
          [[ "$GITHUB_REF_NAME" == *-* ]] && args+=(--prerelease)
          gh release create "${args[@]}" candidate/SHA256SUMS.txt $(find candidate/artifacts -type f ! -name 'latest-mac-*.yml' -print)
