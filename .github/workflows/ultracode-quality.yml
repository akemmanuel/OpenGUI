name: Ultracode quality gate

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ultracode-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Vite+ tests, session guards, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

      - name: Run architecture guards
        run: pnpm run slop-check

      - name: Build production bundles
        run: pnpm run build

  windows-native:
    name: Windows shell and process tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise native shell resolution and process-tree cancellation
        run: pnpm vp test scripts/process-tree.test.ts main/desktop-shell.test.ts packages/harness/src/tools/shell-resolution.test.ts
