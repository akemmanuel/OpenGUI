name: Ultracode quality gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "main/**"
      - "main.ts"
      - "preload.ts"
      - "settings-store.ts"
      - "src/**"
      - "server/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "vite.electron.config.ts"
      - ".github/workflows/ultracode-quality.yml"

concurrency:
  group: ultracode-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Vite+ tests, session guards, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ultracode quality workflow
        run: pnpm run ultracode:quality
