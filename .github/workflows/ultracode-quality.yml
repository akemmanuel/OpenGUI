name: Ultracode quality gate

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ultracode-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Vite+ tests, session guards, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

      - name: Run architecture guards
        run: pnpm run slop-check

      - name: Build production bundles
        run: pnpm run build

  windows-native:
    name: Windows shell and process tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise native shell resolution and process-tree cancellation
        run: pnpm vp test scripts/process-tree.test.ts main/desktop-shell.test.ts packages/harness/src/tools/shell-resolution.test.ts
