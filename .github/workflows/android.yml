name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version override (without a leading v)
        required: false

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm exec vp check

      - name: Build web app
        run: pnpm exec vp build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android
        env:
          OPENGUI_VERSION: ${{ github.event.inputs.version || '' }}

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
        env:
          OPENGUI_VERSION: ${{ github.event.inputs.version || '' }}

      - name: Rename release APK
        env:
          OPENGUI_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          version=${OPENGUI_VERSION:-$(node -p "require('./package.json').version")}
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/*.apk "release-android/OpenGUI-${version#v}-android-release.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengui-android-release-apk
          path: release-android/*.apk
          retention-days: 30
          if-no-files-found: error
